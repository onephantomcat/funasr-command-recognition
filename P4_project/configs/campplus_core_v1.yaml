model:
  id: "iic/speech_campplus_sv_zh-cn_16k-common"
  revision: "v1.0.0"
  checkpoint: "campplus_cn_common.bin"
  sha256: "3388cf5fd3493c9ac9c69851d8e7a8badcfb4f3dc631020c4961371646d5ada8"
  local_path: "artifacts/models/campplus_frozen/"

frontend:
  type: "FBank"
  n_mels: 80
  sample_rate: 16000
  mean_nor: true
  implementation: "torchaudio.compliance.kaldi.fbank"

model_arch:
  class: "speakerlab.models.campplus.DTDNN.CAMPPlus"
