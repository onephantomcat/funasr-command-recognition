# TSE 最小可运行版（smoke test）配置
# 标记：DEBUG_ONLY / BOOTSTRAP_ENCODER_ONLY（随机 embedding 代替 CAM++）
# 依据：总方案 v2.6 §5.1（FiLM、emb_dim 不硬编码）、05A §3（损失权重、λ_id=0 硬约束）

sample_rate: 16000

# STFT 参数（决定频率维 F = n_fft // 2 + 1 = 257）
n_fft: 512
hop_length: 128
win_length: 512

# 注册 embedding 维度（随机张量代替 CAM++，维度只从此处读）
emb_dim: 192

# LSTM 堆叠（控制显存，6GB 预算）
lstm_hidden: 256
lstm_layers: 2

# FiLM 注入：1 + film_scale * tanh(gamma)，防翻转（总方案 §5.1）
film_scale: 0.1

# 损失权重（05A §3）
lambda_target: 1.0
lambda_residual: 0.5
lambda_mix: 0.5
# 身份反向损失权重，硬约束恒为 0，禁止改为非零（05A §3）
lambda_id: 0.0

# 零参考保护系数 κ（05B，ABSENT 预留）
zero_ref_kappa: 1.0e-3

# 可复现
seed: 20260725
