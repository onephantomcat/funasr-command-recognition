# ============================================================
# P2-15 B3 ENROLL-SWAP 场景训练配置（骨架）
# ------------------------------------------------------------
# 任务：训练模型在「enroll 被换成干扰 speaker」时，正确抑制目标 speaker（输出静音）
# 监督信号：
#   - present 样本：target 不变
#   - swap     样本：Dataset 自动取 swap_enroll_wav 做 embedding，同时 target=0
#
# 前置依赖（P1 v3 未交付前此配置仅供冒烟测试）：
#   - manifest 含 is_swap=true 和 swap_enroll_wav 字段
#
# 运行示例（冒烟测试）：
#   python tools/train_b1_trial.py --config configs/tse_b3.yaml \
#       --debug_data --max_steps 5 --device cpu
# ============================================================

sample_rate: 16000

# STFT 参数（与 B1 一致）
n_fft: 512
hop_length: 128
win_length: 512

# 模型结构（与 B1 一致，保证可加载 B1 预训练权重）
emb_dim: 192
lstm_hidden: 256
lstm_layers: 2
dropout: 0.0
film_scale: 0.1

# 损失权重（与 B1 一致 —— swap 样本 target=0，现有 loss 天然监督抑制）
lambda_sisdr: 1.0
lambda_wav: 1.0
lambda_stft: 1.0
lambda_act: 0.5
lambda_residual: 0.5
lambda_mix: 0.5
lambda_id: 0.0

zero_ref_kappa: 1.0e-3
mrstft_resolutions:
  - [256, 64, 256]
  - [512, 128, 512]
  - [1024, 256, 1024]
act_frame_ratio: 0.5

# ============================================================
# ★ B3 核心：场景模式（swap_enroll 判定 + 用干扰 speaker enroll 取 embedding）
# ============================================================
scene_mode: b3

segment_length: 8
batch_size: 16
gradient_accumulation: 1
amp: false            # 保持关闭（稳定第一）
steps: 20000
seed: 20260723
lr: 3.0e-4
lr_warmup_steps: 100
lr_schedule: cosine
grad_clip: 2.0
log_every: 25
save_every: 500
dev_every: 100
shuffle: true
num_workers: 2
pin_memory: true
prefetch_factor: 2

# ============================================================
# ★ P1 v3 manifest 占位符 —— 等 P1 交付 v3_absent_swap 后更新路径
# ============================================================
datasets:
  # TODO(P1 v3): 替换为 swap + present 混合训练 manifest
  # swap 样本字段要求：is_swap=true, swap_enroll_wav=<干扰speaker注册音频路径>
  train_manifest: /root/autodl-tmp/P1_to_P2_v3_absent_swap/manifests/tse_train_swap_mix.jsonl
  dev_manifest:   /root/autodl-tmp/P1_to_P2_v3_absent_swap/manifests/tse_dev_swap_mix.jsonl
  eval_manifest:  /root/autodl-tmp/P1_to_P2_v3_absent_swap/manifests/D_overlap.jsonl

# 元信息
tag: B3_SWAP_seed20260723
lane: INTEGRATION
asset_class: B3_ENROLL_SWAP
notes: "B3 enroll-swap场景: present + swap混合训练. swap样本: embed=swap_enroll_wav(干扰speaker), target=0. P1 v3占位"

# P4 CAMPPlus 嵌入（swap enroll 也走同一份 CAMPPlus 缓存，key=swap_enroll_path MD5，自动不冲突）
sv_mode: campplus
sv_bootstrap_seed: 20260804
sv_model_id: ""
