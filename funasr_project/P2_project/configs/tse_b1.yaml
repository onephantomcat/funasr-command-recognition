# ============================================================
# P2-13 B1 PRESENT 场景正式重训配置（P1 v2 普通 PRESENT）
# ------------------------------------------------------------
# 任务：训练模型在「目标 speaker 出现在 mixture 中」时，正确提取目标语音
# 场景过滤：scene_mode=b1；输入为已经按普通 PRESENT 切分的 P1 v2 manifests。
#
# 注意：P1 v3 是 ABSENT/SWAP 增强集，其 PRESENT 行全部属于 enroll-swap；
#       B2/B3 继续使用 P1 v3，B1 不与它们共用训练 manifest。
#
# 运行方式：
#   云端 GPU 正式训练：
#     python tools/train_b1_trial.py --config configs/tse_b1.yaml --device cuda
#   本地 CPU 冒烟 5 步：
#     python tools/train_b1_trial.py --config configs/tse_b1.yaml --debug_data --max_steps 5 --device cpu
#   用 P1 v2 真实数据冒烟 10 步：
#     python tools/train_b1_trial.py --config configs/tse_b1.yaml --device cpu --max_steps 10
# ============================================================

sample_rate: 16000

# STFT 参数（与 B2/B3 一致）
n_fft: 512
hop_length: 128
win_length: 512

# 模型结构（与 B2/B3 一致，保证可加载预训练权重）
emb_dim: 192
lstm_hidden: 256
lstm_layers: 2
dropout: 0.0
film_scale: 0.1

# PRESENT 损失权重（与 B2/B3 一致）
lambda_sisdr: 1.0
lambda_wav: 1.0
lambda_stft: 1.0
lambda_act: 0.5
lambda_residual: 0.5
lambda_mix: 0.5
lambda_id: 0.0

zero_ref_kappa: 1.0e-3
mrstft_resolutions:
  - [256, 64, 256]
  - [512, 128, 512]
  - [1024, 256, 1024]
act_frame_ratio: 0.5

# ============================================================
# ★ B1 核心：场景模式 = b1（present 场景，target_present=True）
# ============================================================
scene_mode: b1

segment_length: 8
batch_size: 16
gradient_accumulation: 1
amp: true
# 上次 20k 正式训练在 scale 512/256 各出现非有限梯度；回退到 128 后
# 未再出现同类梯度异常。损失现已固定为 FP32，正式重训从实测稳定值启动。
amp_init_scale: 128.0
amp_growth_factor: 2.0
amp_backoff_factor: 0.5
# Keep the validated scale fixed during a 20k run.  The previous interval
# allowed 512 -> 8192 and caused six non-finite-gradient skips.
amp_growth_interval: 100000
steps: 20000
seed: 20260723
lr: 3.0e-4
lr_warmup_steps: 100
lr_schedule: cosine
grad_clip: 2.0
log_every: 25
save_every: 500       # 40 个 ckpt
dev_every: 2000       # 正式训练期间 10 次全量 dev；避免评测挤占训练执行
shuffle: true
num_workers: 2
pin_memory: true
prefetch_factor: 2

# ============================================================
# ★ P1 v2 普通 PRESENT 双 manifest
# ============================================================
datasets:
  # P1 v3 is the ABSENT/SWAP augmentation set and its target-present rows are
  # all enroll-swap scenes.  B1 must use the ordinary PRESENT manifests that
  # produced the validated B1 baseline and the passing 500-step AMP trial.
  train_manifest: /root/autodl-tmp/P1_to_P2_v2_b1/manifests/tse_train_present.jsonl
  dev_manifest: /root/autodl-tmp/P1_to_P2_v2_b1/manifests/tse_dev.jsonl
  eval_manifest: /root/autodl-tmp/P1_to_P2_v2_b1/manifests/D_single.jsonl

# 元信息
tag: B1_PRESENT_seed20260723
lane: INTEGRATION
asset_class: B1_PRESENT
notes: "B1 ordinary PRESENT training on P1 v2 manifests; FP32 losses and AMP scale 128 with growth disabled for the 20k formal run"

# P4 CAMPPlus 嵌入（与 B2/B3 一致）
sv_mode: campplus
sv_bootstrap_seed: 20260804
sv_model_id: "iic/speech_campplus_sv_zh-cn_16k-common"
