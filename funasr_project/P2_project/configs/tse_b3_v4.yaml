# ============================================================
# P2-16 B3 ENROLL-SWAP 场景训练配置 v4（能量提升版）
# ------------------------------------------------------------
# ★ v4 关键改动（基于 v3 的进一步修正）：
#   1. absent_loss_scale: 0.05 → 0.02   （absent 梯度再砍 60%，让 present 梯度占绝对主导）
#   2. lambda_sisdr: 2.0 → 3.0           （提取质量优先，再加强 SI-SDR）
#   3. lambda_act: 1.0 → 2.0             （活动检测头加倍，准确区分 present/absent 帧）
#   4. lr_warmup_steps: 100 → 1500       （warmup 延长到 1500 步，避免 early 被 absent 污染）
#   5. lambda_wav: 0.5 → 0.25            （时域 L1 再降，避免把语音细节压成静音）
#   6. lambda_stft: 0.5 → 0.25           （频域 STFT 再降，避免把频谱细节抹掉）
#   7. zero_ref_kappa: 1.0e-3 → 1.0e-4   （absent 零目标时的 MR-STFT 参考能量阈值再降 10 倍）
#   8. seed: 20260814                    （新种子，独立复现）
#
# v3 评估结果：
#   - corpus_sisdr=+1.23 dB (最低通过)，但 swap_target_2 只有 -0.10 dB → 提取不均衡
#   - mean_act_f1=0.875 → 活动检测已经很好，再加强也没问题
#   - energy_ratio=0.001 → 仍偏低（目标 > 0.3），说明模型对"输出强信号"这件事不敢做
#   - choice_accuracy=null（没有 wrong_enroll 字段），需等 P3 预检跑配对 CER
# ============================================================

sample_rate: 16000

# STFT 参数（与 B1 一致）
n_fft: 512
hop_length: 128
win_length: 512

# 模型结构（与 B1 一致，保证可加载 B1 预训练权重）
emb_dim: 192
lstm_hidden: 256
lstm_layers: 2
dropout: 0.0
film_scale: 0.1

# ============================================================
# ★ v4 损失权重调整（极端偏向高质量提取）
# ============================================================
lambda_sisdr: 3.0       # 提取质量极端优先，v3=2.0 → 3.0
lambda_wav: 0.25        # 时域 L1 再降，v3=0.5 → 0.25
lambda_stft: 0.25       # 频域 STFT 再降，v3=0.5 → 0.25
lambda_act: 2.0         # 活动检测再加强，v3=1.0 → 2.0
lambda_residual: 0.5
lambda_mix: 0.5
lambda_id: 0.0

zero_ref_kappa: 1.0e-4   # absent 零目标 MR-STFT 参考阈值再降 10×，v3=1e-3 → 1e-4
mrstft_resolutions:
  - [256, 64, 256]
  - [512, 128, 512]
  - [1024, 256, 1024]
act_frame_ratio: 0.5

# ============================================================
# ★ absent 样本损失极度压缩（v3=0.05 → v4=0.02）
# ============================================================
absent_loss_scale: 0.02

# ============================================================
# ★ B3 场景模式（enroll_swap 三种子场景混合）
# ============================================================
scene_mode: b3

segment_length: 8
batch_size: 16
gradient_accumulation: 1
amp: false
steps: 20000
seed: 20260814
lr: 3.0e-4
lr_warmup_steps: 1500     # warmup 延长到 1500 步（v3=100），避免 early absent 污染
lr_schedule: cosine
grad_clip: 2.0
log_every: 25
save_every: 500
dev_every: 100
shuffle: true
num_workers: 2
pin_memory: true
prefetch_factor: 2

# ============================================================
# ★ P1 v3 单 manifest + split 过滤
# ============================================================
datasets:
  manifest: /root/autodl-tmp/P1_to_P2_v3_absent_swap/manifest.jsonl
  train_split: train
  dev_split:   dev
  eval_split: D_swap

# 元信息
tag: B3_SWAP_v4_energy_boost
lane: INTEGRATION
asset_class: B3_ENROLL_SWAP_V4
notes: "B3 v4: absent_loss_scale=0.02, lambda_sisdr=3.0, lambda_act=2.0, zero_ref_kappa=1e-4, warmup=1500. 从 B1_50K_RESUME warm-start。核心目标：把 energy_ratio 从 0.001 提到 0.3+，corpus SI-SDR 从 +1.23 dB 提到 +5 dB+，swap_target_2 SI-SDR 转正。"

# P4 CAMPPlus 嵌入
sv_mode: campplus
sv_bootstrap_seed: 20260804
sv_model_id: "iic/speech_campplus_sv_zh-cn_16k-common"
