# ============================================================
# P2-14 B2 ABSENT 场景训练配置 v4（真实 CAM++ + ZERO SCRATCH）★ 解决 warm-start 负迁移
# ------------------------------------------------------------
# v4 关键决策：取消 B1 warm-start → 从零训练（SCRATCH）
#   原因：B1 教模型"输出有声音的 target"是 B2 ABSENT 任务的负迁移
#         ABSENT 输出零任务很简单，scratch 10K 步 ≈ 2-3 小时即可收敛
#
# v4 其他参数保留 v3 强损失设置：
#   lambda_act=2.0, lambda_wav=2.0, lambda_stft=2.0, zero_ref_kappa=1e-2
#   total_steps: 20K → 10K（ABSENT 任务简单，10K 足够收敛，2-3h 完成）
# ============================================================

sample_rate: 16000

n_fft: 512
hop_length: 128
win_length: 512

emb_dim: 192
lstm_hidden: 256
lstm_layers: 2
dropout: 0.0
film_scale: 0.1

# ★ ABSENT 任务：强 L1 / ACT / STFT 压制零输出（保留 v3 设置）
lambda_sisdr: 1.0
lambda_wav: 2.0
lambda_stft: 2.0
lambda_act: 2.0
lambda_residual: 0.5
lambda_mix: 0.5
lambda_id: 0.0

zero_ref_kappa: 1.0e-2
mrstft_resolutions:
  - [256, 64, 256]
  - [512, 128, 512]
  - [1024, 256, 1024]
act_frame_ratio: 0.5

scene_mode: b2

segment_length: 8
batch_size: 16
gradient_accumulation: 1
amp: false
steps: 10000          # v3=20K → 10K（ABSENT 任务简单，10K 足够收敛）
seed: 20260814
lr: 5.0e-4            # scratch 起步 lr 稍大一点，加速初期收敛
lr_warmup_steps: 300  # warmup 拉长防梯度爆炸
lr_schedule: cosine
grad_clip: 2.0
log_every: 25
save_every: 500
dev_every: 100
shuffle: true
num_workers: 2
pin_memory: true
prefetch_factor: 2

datasets:
  manifest: /root/autodl-tmp/P1_to_P2_v3_absent_swap/manifest.jsonl
  train_split: train
  dev_split:   dev
  eval_split: D_absent

tag: B2_ABSENT_v4_campplus_SCRATCH
lane: INTEGRATION
asset_class: B2_ABSENT_V4_CAMPPLUS_SCRATCH
notes: "B2 v4: 从零训练（NO warm-start），scene_mode=b2（全 absent），真实 CAM++，lambda_act=2.0, lambda_wav=2.0, lambda_stft=2.0, zero_ref_kappa=1e-2，10K 步。目标 speaker 缺席时输出静音。"

sv_mode: campplus
sv_bootstrap_seed: 20260804
sv_model_id: ""
