# ============================================================
# P2-14 B2 ABSENT 场景训练配置（P1 v3 最终版）
# ------------------------------------------------------------
# 任务：训练模型在「目标 speaker 未出现在 mixture 中」时，输出静音（零抑制）
# 场景过滤：scene_mode=b2 → 自动取 scenario ∈ {absent, enroll_swap_absent}（target_present=False）
# split 过滤：manifest.jsonl 内含 split 字段（train/dev/D_absent/D_swap）
#
# 运行方式：
#   云端 GPU 正式训练：
#     python tools/train_b1_trial.py --config configs/tse_b2.yaml --device cuda
#   本地 CPU 冒烟 5 步（走 debug data 兼容分支）：
#     python tools/train_b1_trial.py --config configs/tse_b2.yaml --debug_data --max_steps 5 --device cpu
#   用 P1 v3 真实数据冒烟 10 步：
#     python tools/train_b1_trial.py --config configs/tse_b2.yaml --device cpu --max_steps 10 \
#         --manifest /root/autodl-tmp/P1_to_P2_v3_absent_swap/manifest.jsonl
# ============================================================

sample_rate: 16000

# STFT 参数（与 B1 一致）
n_fft: 512
hop_length: 128
win_length: 512

# 模型结构（与 B1 一致，保证可加载 B1 预训练权重）
emb_dim: 192
lstm_hidden: 256
lstm_layers: 2
dropout: 0.0
film_scale: 0.1

# 损失权重（与 B1 一致 —— absent 样本 target=0，现有 loss 天然监督零抑制）
lambda_sisdr: 1.0
lambda_wav: 1.0
lambda_stft: 1.0
lambda_act: 0.5
lambda_residual: 0.5
lambda_mix: 0.5
lambda_id: 0.0

zero_ref_kappa: 1.0e-3
mrstft_resolutions:
  - [256, 64, 256]
  - [512, 128, 512]
  - [1024, 256, 1024]
act_frame_ratio: 0.5

# ============================================================
# ★ B2 核心：场景模式（强制 absent 判定 + 零向量 embedding）
# ============================================================
scene_mode: b2

segment_length: 8
batch_size: 16
gradient_accumulation: 1
amp: false            # 保持关闭（稳定第一，B2 初期不要 AMP）
steps: 20000          # 20K 起步，后续按需拉长
seed: 20260723
lr: 3.0e-4
lr_warmup_steps: 100
lr_schedule: cosine
grad_clip: 2.0
log_every: 25
save_every: 500       # 40 个 ckpt
dev_every: 100        # 200 次 dev 评测
shuffle: true
num_workers: 2
pin_memory: true
prefetch_factor: 2

# ============================================================
# ★ P1 v3 单 manifest + split 过滤（P1 已交付，split=train/dev/D_absent）
# ============================================================
datasets:
  # P1 v3 全量 59K 样本的 manifest.jsonl（内含 scenario/target_present/split 字段）
  manifest: /root/autodl-tmp/P1_to_P2_v3_absent_swap/manifest.jsonl
  # train/dev 均从单 manifest 过滤：
  #   train: split=train → 20,000 absent + 10,000 enroll_swap_absent → total 30K
  #   dev:   split=dev   →  2,000 absent +  1,000 enroll_swap_absent → total  3K
  train_split: train
  dev_split:   dev
  # D_absent 评估集（1,000 条，训练期不用，final eval 用）
  eval_split: D_absent

# 元信息
tag: B2_ABSENT_seed20260723
lane: INTEGRATION
asset_class: B2_ABSENT
notes: "B2 零抑制场景: scenario=absent+enroll_swap_absent（target_present=False）共 30K train/3K dev. P1 v3 manifest.jsonl 单文件按 split 过滤"

# P4 CAMPPlus 嵌入（与 B1 一致，保证可复用缓存）
sv_mode: campplus
sv_bootstrap_seed: 20260804
sv_model_id: "/root/autodl-tmp/funasr-command-recognition/funasr_project/P4_project/artifacts/models/campplus_cn_common.bin"
