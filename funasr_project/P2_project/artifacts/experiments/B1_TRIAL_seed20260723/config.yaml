# P2-12 B1 500-step 试车配置（方案 H：batch=16, 8s, AMP on）
# 依据：手册 STEP P2-12；6GB 显存可行性评估 2026-08-02
# 标记：B1_TRIAL / SUPPORTS_CAMPLUS（P2-17 P4 对接已完成）
# 与 tse_overfit_debug.yaml 的差异：新增 segment_length/amp/warmup/cosine/save_every/shuffle/num_workers/datasets

sample_rate: 16000

# STFT 参数（与 P2-09 / smoke 一致）
n_fft: 512
hop_length: 128
win_length: 512

# 模型结构（与 P2-09 一致）
emb_dim: 192
lstm_hidden: 256
lstm_layers: 2
dropout: 0.0
film_scale: 0.1

# PRESENT 损失权重（与 P2-09 一致）
lambda_sisdr: 1.0
lambda_wav: 1.0
lambda_stft: 1.0
lambda_act: 0.5
lambda_residual: 0.5
lambda_mix: 0.5
lambda_id: 0.0

zero_ref_kappa: 1.0e-3

# MR-STFT 分辨率组 [(n_fft, hop, win), ...]
mrstft_resolutions:
  - [256, 64, 256]
  - [512, 128, 512]
  - [1024, 256, 1024]

# 帧级活动度阈值
act_frame_ratio: 0.5

# ---- B1 试车参数（与 P2-09 核心差异）----
segment_length: 8
batch_size: 16
gradient_accumulation: 1
amp: true
steps: 500
seed: 20260723
lr: 1.0e-3
lr_warmup_steps: 50
lr_schedule: cosine
grad_clip: 5.0
log_every: 25
save_every: 100
shuffle: true
num_workers: 2
pin_memory: true
prefetch_factor: 2

# 数据集
datasets:
  train_manifest: data/p1_v2_b1/train.jsonl
  dev_manifest: data/p1_v2_b1/dev.jsonl
  eval_manifest: data/p1_v2_b1/eval.jsonl

# 元信息
tag: B1_TRIAL_seed20260723
lane: INTEGRATION
asset_class: B1_TRIAL
notes: "P1 v2_b1 未交付时用 DEBUG 数据空跑（--debug_data）"

# ---- P2-17 / P4-04：说话人注册嵌入模式 ----
# bootstrap: 哈希派生确定性随机向量（零依赖，默认）
# campplus:  P4 CAM++ 真实声纹嵌入（需 speakerlab + 权重）
sv_mode: campplus
sv_bootstrap_seed: 20260804
sv_model_id: ""